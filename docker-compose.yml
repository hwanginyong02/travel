services:
  db:
    image: postgres:15-alpine
    container_name: travel-db
    restart: always
    # ${VAR}는 이 파일 옆의 루트 .env(또는 셸 환경변수)에서만 치환됩니다.
    # backend/.env를 env_file로 넣어도 여기 값으로는 쓰이지 않으므로 섞지 않습니다.
    # 비밀번호는 기본값을 두지 않습니다. 값이 없으면 조용히 약한 비번으로 뜨는 대신
    # compose가 즉시 실패하도록 :? 를 씁니다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?루트 .env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-travel_db}
    # 5432는 호스트로 열지 않습니다. backend가 내부 네트워크로 db:5432에 붙습니다.
    # 외부에서 DB에 접속해야 하면 SSH 터널을 쓰세요:
    #   ssh -L 5432:localhost:5432 <user>@<서버IP>
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel-backend
    restart: always
    ports:
      - "8000:8000"
      - "80:8000"

    # API 키·JWT 시크릿 등은 backend/.env에서 주입합니다.
    env_file:
      - ./backend/.env

    # DATABASE_URL은 db 서비스와 똑같은 변수로 조립합니다.
    # environment가 env_file보다 우선하므로 backend/.env에 남아 있는
    # localhost용 DATABASE_URL은 여기서 덮어써집니다.
    # 비밀번호를 두 곳에 각각 적지 않게 되어 불일치가 구조적으로 불가능해집니다.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?루트 .env에 POSTGRES_PASSWORD를 설정하세요}@db:5432/${POSTGRES_DB:-travel_db}

    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KAKAO_APP_KEY: ${NEXT_PUBLIC_KAKAO_APP_KEY}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_KAKAO_REST_API_KEY: ${NEXT_PUBLIC_KAKAO_REST_API_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: travel-frontend
    restart: always
    ports:
      - "3000:3000"
      - "80:3000"



    environment:
      - NODE_ENV=production
    depends_on:
      - backend


volumes:
  postgres_data:
  backend_uploads:
