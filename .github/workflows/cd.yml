name: MVCD - Continuous Deployment

on:
  push:
    branches: [ dev, main, ci/cd ]
  workflow_dispatch:

jobs:
  ci-check:
    name: Run Pre-Deployment CI Checks
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Deploy Backend (${{ github.ref_name }})
    needs: ci-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACK_EC2_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          password: ${{ secrets.EC2_PASSWORD }}
          port: 22
          script: |
            TARGET_DIR="/home/${{ secrets.EC2_USERNAME }}/travel"
            BRANCH="${{ github.ref_name }}"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1



            if [ ! -d ".git" ]; then
              echo "Cloning repository to $TARGET_DIR..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            echo "Checkout and syncing branch: $BRANCH..."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "Ensuring backend/.env file exists..."
            if [ -n "${{ secrets.BACKEND_ENV }}" ]; then
              echo "Writing backend/.env from BACKEND_ENV Secret..."
              echo "${{ secrets.BACKEND_ENV }}" > backend/.env
            elif [ ! -f "backend/.env" ]; then
              touch backend/.env
            fi



            echo "Directory contents in $(pwd):"
            ls -la

            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ Error: docker-compose.yml file not found in $(pwd)!"
              exit 1
            fi

            echo "Starting Backend Container ($BRANCH)..."
            docker compose -f docker-compose.yml up -d --build backend db

            echo "Waiting for Backend container initialization..."
            SUCCESS=0
            for i in {1..12}; do
              if curl -sf http://localhost:8000/healthz; then
                echo "✅ Backend container local health check succeeded!"
                SUCCESS=1
                break
              fi
              echo "Waiting for Backend service to listen on 8000... ($i/12)"
              sleep 5
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "❌ Backend Container Startup Failed! Printing Container Logs:"
              docker logs travel-backend --tail 50
              exit 1
            fi

            docker image prune -f

      - name: Backend Health Check Verification (External Public IP)
        run: |
          BACK_IP="${{ secrets.BACK_EC2_HOST || secrets.EC2_HOST }}"
          echo "Verifying Backend health check from GitHub runner at http://${BACK_IP}:8000/healthz..."
          curl --fail --retry 6 --retry-delay 5 --retry-connrefused "http://${BACK_IP}:8000/healthz" || {
            echo "❌ Backend External Health Check Failed! Check AWS Security Group port 8000 or EC2 IP."
            exit 1
          }
          echo "✅ Backend External Health Check Passed Successfully!"

  deploy-frontend:
    name: Deploy Frontend (${{ github.ref_name }})
    needs: ci-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONT_EC2_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          password: ${{ secrets.EC2_PASSWORD }}
          port: 22
          script: |
            TARGET_DIR="/home/${{ secrets.EC2_USERNAME }}/travel"
            BRANCH="${{ github.ref_name }}"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1



            if [ ! -d ".git" ]; then
              echo "Cloning repository to $TARGET_DIR..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            echo "Checkout and syncing branch: $BRANCH..."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "Ensuring backend/.env file exists..."
            if [ ! -f "backend/.env" ]; then
              touch backend/.env
            fi


            echo "Directory contents in $(pwd):"
            ls -la

            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ Error: docker-compose.yml file not found in $(pwd)!"
              exit 1
            fi

            echo "Starting Frontend Container ($BRANCH)..."
            NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            NEXT_PUBLIC_KAKAO_APP_KEY="${{ secrets.NEXT_PUBLIC_KAKAO_APP_KEY }}" \
            NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
            NEXT_PUBLIC_KAKAO_REST_API_KEY="${{ secrets.NEXT_PUBLIC_KAKAO_REST_API_KEY }}" \
            docker compose -f docker-compose.yml up -d --build --no-deps frontend


            echo "Waiting for Frontend container initialization..."
            SUCCESS=0
            for i in {1..12}; do
              if curl -sf http://localhost:3000; then
                echo "✅ Frontend container local health check succeeded!"
                SUCCESS=1
                break
              fi
              echo "Waiting for Frontend service to listen on 3000... ($i/12)"
              sleep 5
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "❌ Frontend Container Startup Failed! Printing Container Logs:"
              docker logs travel-frontend --tail 50
              exit 1
            fi

            docker image prune -f

      - name: Frontend Health Check Verification (External Public IP)
        run: |
          FRONT_IP="${{ secrets.FRONT_EC2_HOST || secrets.EC2_HOST }}"
          echo "Verifying Frontend health check from GitHub runner at http://${FRONT_IP}:3000..."
          curl --fail --retry 6 --retry-delay 5 --retry-connrefused "http://${FRONT_IP}:3000" || {
            echo "❌ Frontend External Health Check Failed! Check AWS Security Group port 3000 or EC2 IP."
            exit 1
          }
          echo "✅ Frontend External Health Check Passed Successfully!"
