name: MVCI - Continuous Integration

on:
  push:
    branches: [ dev, ci/cd ]
  pull_request:
    branches: [ dev, main, ci/cd ]
  workflow_call:



jobs:
  backend-ci:
    name: Backend CI (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend Syntax & Import Sanity Check
        run: |
          cd backend
          python -m py_compile app/main.py
          python -c "from app.main import app; print('FastAPI App successfully initialized')"

  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_KAKAO_APP_KEY: "dummy_key"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "dummy_key"
          NEXT_PUBLIC_KAKAO_REST_API_KEY: "dummy_key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: |
          cd frontend
          npm run build
